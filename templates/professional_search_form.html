<!DOCTYPE html>
    <head>
        <title>Professional Search Form</title>
        <style>
            input{
                margin-left: 15px;
            }
        </style>
    </head>
    <body style="margin: 50px;">
        <h1>Professional's Dashboard</h1>
        <p style="font-size:110%"><a style="margin-right: 20px;" href="/professional/{{professional.Professional_ID}}">Home</a> <a style="margin-right: 20px;" href="">Search</a> <a style="margin-right: 20px;" href="/professional_summary/{{professional.Professional_ID}}">Summary</a> <a style="margin-right: 550px;" href="/login">Logout</a> Welcome {{professional.First_Name}} {{professional.Last_Name}}, <a href = "/update_professional_profile/{{professional.Professional_ID}}"><button>Edit Profile</button></a></p>
        <fieldset>
            <legend>Search from Request history</legend>
            <form method="post">
                <p>Search by : 
                    <select name="search_by" required>
                        <option value="request_id">Request ID</option>
                        <option value="customer_name">Customer Name</option>
                        <option value="pincode">Location (Pincode)</option>
                        <option value="date">Date (YYYY-MM-DD)</option>
                    </select> 
                    <input type="text" name="field" required />
                    <input type="submit" value="Submit" />
                </p>  
            </form>
        </fieldset>        
    </body>    
</html>
