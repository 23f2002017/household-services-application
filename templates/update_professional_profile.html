<!DOCTYPE html>
    <head>
        <title>Profile Update</title>
    </head>
    <body style="margin-left: 50px;">
        <h1>User Profile Update</h1>
        <fieldset style="margin-right: 900px;">
            <legend>Update Professional's Details</legend>
            <form method="post">
                <p>First Name : <input type="text" name="first_name" value = "{{professional.First_Name}}" required/></p>
                <p>Last Name : <input type="text" name="last_name" value = "{{professional.Last_Name}}" required/></p>
                <p>Email : <input type="email" name="email" value = "{{professional.Email}}" disabled/></p>
                <p>Password : <input type="password" name="password" value = "{{professional.Password}}" required/></p>
                <p>Select your Service Type : 
                    <select name="service_type" value = "{{professional.Service_Type}}" required>
                        {% for service_type in service_lst %}
                        <option value="{{service_type}}">{{service_type}}</option>
                        {% endfor %}
                    </select> </p>
                <p>Experience : <input type="number" name="experience" value = "{{professional.Experience}}" required/> (in months)</p>    
                <p>Zip Code : <input type="number" name="pincode" value = "{{professional.Pincode}}" required/></p> 
                <input type="submit" value="Edit" />
            </form>
        </fieldset>    
    </body>
</html>
