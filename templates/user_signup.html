<!DOCTYPE html>
    <head>
        <title>User Registration</title>
    </head>
    <body style="margin-left: 50px;">
        <h1>User Registration</h1>
        <fieldset style="margin-right: 900px;">
            <legend>Input User Registration Details</legend>
            <form method="post" action="/user_signup" >
                <p>First Name : <input type="text" name="first_name" required="required"/></p>
                <p>Last Name : <input type="text" name="last_name" required="required"/></p>
                <p>Phone : <input type="number" name="phone" required="required"/></p>
                <p>Email : <input type="email" name="email" required="required"/></p>
                <p>Password : <input type="password" name="password" required="required"/></p>
                <p>Address : <br /><textarea name="address" rows="4" cols="40" placeholder="Enter your Address..." required="required"/></textarea>
                <p>Zip Code : <input type="number" name="pincode" required="required"/></p>    
                <input type="submit" value="Sign Up" />
            </form>
        </fieldset>    
    </body>
</html>
