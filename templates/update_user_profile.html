<!DOCTYPE html>
    <head>
        <title>Profile Update</title>
    </head>
    <body style="margin-left: 50px;">
        <h1>User Profile Update</h1>
        <fieldset style="margin-right: 900px;">
            <legend>Update User Details</legend>
            <form method="post">
                <p>First Name : <input type="text" name="first_name" value = "{{user.First_Name}}" required="required"/></p>
                <p>Last Name : <input type="text" name="last_name" value = "{{user.Last_Name}}" required="required"/></p>
                <p>Phone : <input type="number" name="phone" value = "{{user.Phone_No}}" required="required"/></p>
                <p>Email : <input type="email" name="email" value = "{{user.Email}}" disabled/></p>
                <p>Password : <input type="password" name="password" value = "{{user.Password}}" required="required"/></p>
                <p>Address : <br /><textarea name="address" rows="4" cols="40" required="required"/>{{user.Address}}</textarea>
                <p>Zip Code : <input type="number" name="pincode" value = "{{user.Pincode}}" required="required"/></p>    
                <input type="submit" value="Edit" />
            </form>
        </fieldset>    
    </body>
</html>
